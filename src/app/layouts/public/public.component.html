<div class="public-layout">
	<header class="public-layout__topbar">
		<!-- 1. НОВА ІКОНКА HOME ЗЛІВА -->
		<a
			aria-label="Home"
			routerLink="/home"
			class="public-layout__home-btn"
			style="
				display: flex;
				align-items: center;
				color: var(--c-text-primary);
			"
		>
			<material-icon icon="home"></material-icon>
		</a>

		<!-- 2. ЗАГОЛОВОК ПО ЦЕНТРУ -->
		<div class="public-layout__title">{{ pageTitle() }}</div>

		<!-- 3. ІКОНКА ПРОФІЛЮ СПРАВА -->
		@if (pageTitle() !== 'Profile') {
		<a
			aria-label="Profile"
			routerLink="/profile"
			class="public-layout__profile"
		>
			<material-icon icon="person"></material-icon>
		</a>
		} @else {
		<!-- Пустий блок для балансу, щоб заголовок був ідеально по центру, коли профілю нема -->
		<div style="width: 24px"></div>
		}
	</header>

	<main class="public-layout__main">
		<router-outlet />
	</main>

	<nav aria-label="Primary navigation" class="public-layout__navigation">
		<!-- Home звідси видалили, лишилися тільки ці 4 -->
		<a routerLink="/explore" routerLinkActive="public-layout__link--active">
			<material-icon icon="explore"></material-icon>
			<span>Explore</span>
		</a>
		<a
			routerLink="/"
			routerLinkActive="public-layout__link--active"
			[routerLinkActiveOptions]="{ exact: true }"
		>
			<material-icon icon="dynamic_feed"></material-icon>
			<span>Feed</span>
		</a>
		<a routerLink="/map" routerLinkActive="public-layout__link--active">
			<material-icon icon="map"></material-icon>
			<span>Map</span>
		</a>
		<a
			routerLink="/workspace"
			routerLinkActive="public-layout__link--active"
		>
			<material-icon icon="workspaces"></material-icon>
			<span>Workspace</span>
		</a>
		<a routerLink="/cook" routerLinkActive="public-layout__link--active">
			<material-icon icon="soup_kitchen"></material-icon>
			<span>Cook</span>
		</a>
	</nav>
</div>
