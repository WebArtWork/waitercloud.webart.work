<div class="flex flex-col gap-5 pb-6">
	<div class="flex items-center justify-between">
		<h1 class="text-xl font-bold text-[var(--c-text-primary)]">Огляд</h1>
		<button
			class="flex items-center gap-1 rounded-full bg-[var(--c-bg-tertiary)] px-3 py-1.5 text-[var(--c-text-muted)] transition-colors hover:text-[var(--c-text-primary)]"
		>
			<material-icon
				icon="location_on"
				class="text-[1.1rem]"
			></material-icon>
			<span class="text-xs font-semibold">Україна</span>
			<material-icon
				icon="expand_more"
				class="text-[1.1rem]"
			></material-icon>
		</button>
	</div>

	<div class="relative w-full">
		<material-icon
			icon="search"
			class="absolute left-4 top-1/2 -translate-y-1/2 text-[var(--c-text-muted)]"
		></material-icon>
		<input
			type="text"
			placeholder="Пошук рецептів, ресторанів, людей..."
			class="w-full rounded-[var(--radius-btn)] border border-[var(--c-border)] bg-[var(--c-bg-tertiary)] py-3 pl-14 pr-4 text-sm text-[var(--c-text-primary)] outline-none transition-colors focus:border-[var(--c-text-primary)]"
		/>
	</div>

	<div class="flex gap-2 overflow-x-auto pb-1 [&::-webkit-scrollbar]:hidden">
		@for (filter of filters(); track filter) {
		<button
			type="button"
			(click)="setFilter(filter)"
			class="whitespace-nowrap rounded-[var(--radius-btn)] px-4 py-2 text-sm font-semibold transition-colors"
			[class]="activeFilter() === filter
                    ? 'bg-[var(--c-text-primary)] text-[var(--c-bg-primary)]'
                    : 'bg-[var(--c-bg-tertiary)] text-[var(--c-text-muted)] hover:text-[var(--c-text-primary)]'"
		>
			{{ filter }}
		</button>
		}
	</div>

	<div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4">
		@for (item of exploreItems(); track item.id) {

		<!-- Якщо це Рецепт -->
		@if ($any(item).type === 'recipe' || $any(item).type === 'recipes') {
		<recipe-short
			[routerLink]="['/recipe', item.id]"
			[recipe]="{
                        id: item.id,
                        title: item.title,
                        author: $any(item).subtitle || 'Невідомий автор',
                        imageUrl: $any(item).image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c',
                        status: $any(item).type
                    }"
			class="w-full cursor-pointer transition-transform hover:scale-[1.02]"
		></recipe-short>
		}

		<!-- Якщо це Ресторан -->
		@else if ($any(item).type === 'restaurant' || $any(item).type ===
		'restaurants' || $any(item).type === 'Rest') {
		<restaurant-short
			[routerLink]="['/restaurant', item.id]"
			[restaurant]="{
                        id: item.id,
                        title: item.title,
                        description: $any(item).subtitle || 'Опис закладу',
                        imageUrl: $any(item).image || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4',
                        rating: $any(item).rating || 5.0
                    }"
			class="w-full cursor-pointer transition-transform hover:scale-[1.02]"
		></restaurant-short>
		}

		<!-- Фолбек для інших типів (щоб нічого не пропало з видачі) -->
		@else {
		<recipe-short
			[routerLink]="['/entity', item.id]"
			[recipe]="{
                        id: item.id,
                        title: item.title,
                        author: $any(item).subtitle || 'Деталі',
                        imageUrl: $any(item).image || 'https://placehold.co/400x300/eeeeee/999999?text=Entity',
                        status: $any(item).type
                    }"
			class="w-full cursor-pointer opacity-70"
		></recipe-short>
		} }
	</div>
</div>
