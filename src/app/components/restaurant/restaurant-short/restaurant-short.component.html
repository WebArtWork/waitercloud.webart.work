<div
	class="flex flex-col rounded-[var(--radius-btn)] bg-[var(--c-bg-secondary)] overflow-hidden shadow-sm border border-[var(--c-border)] transition-transform hover:scale-[1.02] cursor-pointer"
>
	<div class="relative h-48 w-full">
		<img
			[src]="restaurant().imageUrl"
			[alt]="restaurant().title"
			class="h-full w-full object-cover"
		/>
		<div
			class="absolute top-2 right-2 bg-black/70 backdrop-blur-md rounded-full px-2 py-1 flex items-center gap-1 text-white text-xs font-bold"
		>
			<material-icon
				icon="star"
				class="text-[14px] text-yellow-400"
			></material-icon>
			{{ restaurant().rating }}
		</div>
	</div>
	<div class="p-4 flex flex-col gap-2">
		<h3 class="text-lg font-bold text-[var(--c-text-primary)]">
			{{ restaurant().title }}
		</h3>
		<p class="text-sm text-[var(--c-text-secondary)] line-clamp-2">
			{{ restaurant().description }}
		</p>
	</div>
</div>
