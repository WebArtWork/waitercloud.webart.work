<article class="recipe-view">
	<img
		class="recipe-view__image"
		[src]="recipe().imageUrl"
		[alt]="recipe().title"
		loading="eager"
		decoding="async"
	/>
	<div class="recipe-view__overlay"></div>

	<div class="recipe-view__info">
		<a
			[routerLink]="['/recipe']"
			[queryParams]="{ id: recipe().id }"
			class="recipe-view__title-link group"
		>
			<h1 class="recipe-view__title">{{ recipe().title }}</h1>
			<span class="recipe-view__more">
				Детальніше
				<material-icon
					icon="chevron_right"
					class="text-[1rem]"
				></material-icon>
			</span>
		</a>

		<div class="recipe-view__author-row">
			<a
				[routerLink]="['/author']"
				[queryParams]="{ id: recipe().author }"
				class="recipe-view__author-link"
			>
				<div class="recipe-view__avatar">
					<material-icon
						icon="person"
						class="text-xs text-white"
					></material-icon>
				</div>
				<span class="recipe-view__author-name"
					>{{ recipe().author }}</span
				>
			</a>
			<button type="button" class="recipe-view__follow-btn">
				Follow
			</button>
		</div>
	</div>

	<div class="recipe-view__actions">
		<button type="button" class="recipe-view__action-btn group">
			<div class="recipe-view__action-icon">
				<material-icon icon="favorite"></material-icon>
			</div>
			<span class="recipe-view__action-count">{{ recipe().likes }}</span>
		</button>

		<!-- Відкриття шторки коментарів -->
		<button
			type="button"
			class="recipe-view__action-btn group"
			(click)="toggleComments()"
		>
			<div class="recipe-view__action-icon">
				<material-icon icon="chat_bubble"></material-icon>
			</div>
			<span class="recipe-view__action-count"
				>{{ commentsList().length }}</span
			>
		</button>

		<button type="button" class="recipe-view__action-btn group">
			<div class="recipe-view__action-icon">
				<material-icon icon="share"></material-icon>
			</div>
		</button>
	</div>

	<!-- Модальна панель відгуків та коментарів -->
	@if (showComments()) {
	<div class="recipe-view__comments-backdrop" (click)="toggleComments()">
		<div
			class="recipe-view__comments-sheet"
			(click)="$event.stopPropagation()"
		>
			<div class="recipe-view__comments-header">
				<span class="recipe-view__comments-title">Коментарі</span>
				<button
					type="button"
					class="recipe-view__comments-close"
					(click)="toggleComments()"
				>
					<material-icon icon="close"></material-icon>
				</button>
			</div>
			<div class="recipe-view__comments-content">
				<comments-view
					[comments]="commentsList()"
					title="Відгуки до рецепта"
					(addComment)="onAddComment($event)"
				></comments-view>
			</div>
		</div>
	</div>
	}
</article>
