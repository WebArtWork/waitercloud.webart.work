<form
	(submit)="onSubmit(); $event.preventDefault()"
	class="flex flex-col gap-5 rounded-[var(--radius-btn)] bg-[var(--c-bg-tertiary)] p-5 border border-[var(--c-border)]"
>
	<h3 class="text-lg font-bold text-[var(--c-text-primary)]">
		Створення рецепта
	</h3>

	<!-- Поле: Назва -->
	<div class="flex flex-col gap-1.5">
		<label class="text-xs font-semibold text-[var(--c-text-muted)]">
			Назва рецепта
		</label>
		<input
			type="text"
			placeholder="Введіть назву..."
			[value]="recipeModel().title"
			(input)="recipeModel.update(v => ({ ...v, title: $any($event.target).value }))"
			class="rounded-[var(--radius-btn)] border border-[var(--c-border)] bg-[var(--c-bg-primary)] px-4 py-2.5 text-sm text-[var(--c-text-primary)] outline-none transition-colors focus:border-[var(--c-text-primary)]"
			[class.border-red-500]="recipeForm.title().errors().length"
		/>
		<!-- Виведення помилки валідації -->
		@if (recipeForm.title().errors().length) {
		<span class="text-xs font-medium text-red-500">
			{{ recipeForm.title().errors()[0]?.message }}
		</span>
		}
	</div>

	<!-- Поле: Опис -->
	<div class="flex flex-col gap-1.5">
		<label class="text-xs font-semibold text-[var(--c-text-muted)]">
			Опис
		</label>
		<textarea
			rows="4"
			placeholder="Детальний опис..."
			[value]="recipeModel().description"
			(input)="recipeModel.update(v => ({ ...v, description: $any($event.target).value }))"
			class="rounded-[var(--radius-btn)] border border-[var(--c-border)] bg-[var(--c-bg-primary)] px-4 py-2.5 text-sm text-[var(--c-text-primary)] outline-none transition-colors focus:border-[var(--c-text-primary)] resize-none"
			[class.border-red-500]="recipeForm.description().errors().length"
		></textarea>
		<!-- Виведення помилки валідації -->
		@if (recipeForm.description().errors().length) {
		<span class="text-xs font-medium text-red-500">
			{{ recipeForm.description().errors()[0]?.message }}
		</span>
		}
	</div>

	<!-- Кнопка збереження -->
	<div class="flex justify-end mt-2">
		<button
			type="submit"
			[disabled]="isSubmitting()"
			class="rounded-[var(--radius-btn)] bg-[var(--c-text-primary)] px-6 py-2.5 text-sm font-bold text-[var(--c-bg-primary)] transition-opacity hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed"
		>
			@if (isSubmitting()) { Збереження... } @else { Зберегти рецепт }
		</button>
	</div>
</form>
